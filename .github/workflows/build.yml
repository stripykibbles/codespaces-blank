name: Build Onward App

on:
  push:
    branches: [ 2.0 ]
  workflow_dispatch:

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PySide6 pyinstaller

      - name: Build app
        run: |
          pyinstaller onward.spec

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r Onward-Mac.zip Onward.app

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Onward-Mac
          path: dist/Onward-Mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PySide6 pyinstaller

      - name: Build app
        run: |
          pyinstaller onward.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Onward-Windows
          path: dist/Onward.exe
