<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter Feature Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f3;
    --bg-tertiary: #efefed;
    --text: #1a1a1a;
    --text-secondary: #75767d;
    --text-tertiary: #aaaaaa;
    --border: rgba(0,0,0,0.1);
    --border-secondary: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c;
      --bg-secondary: #242424;
      --bg-tertiary: #2e2e2e;
      --text: #f0f0ee;
      --text-secondary: #999990;
      --text-tertiary: #666660;
      --border: rgba(255,255,255,0.1);
      --border-secondary: rgba(255,255,255,0.18);
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 720px; margin: 0 auto; font-size: 15px; line-height: 1.5; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; color: var(--text); }
  .summary-row { display: flex; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .stat { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 10px 16px; flex: 1; min-width: 80px; }
  .stat-num { font-size: 22px; font-weight: 500; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
  .toolbar input { flex: 1; min-width: 180px; font-size: 14px; padding: 8px 12px; border-radius: var(--radius-md); border: 0.5px solid var(--border-secondary); background: var(--bg); color: var(--text); outline: none; }
  .toolbar input:focus { border-color: var(--text-secondary); }
  .toolbar select { font-size: 14px; padding: 8px 10px; border-radius: var(--radius-md); border: 0.5px solid var(--border-secondary); background: var(--bg); color: var(--text); outline: none; cursor: pointer; }
  .btn { font-size: 13px; padding: 8px 14px; border-radius: var(--radius-md); border: 0.5px solid var(--border-secondary); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--bg-secondary); }
  .filters { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text-secondary); cursor: pointer; }
  .filter-btn.active { background: var(--bg-secondary); color: var(--text); border-color: var(--border-secondary); }
  .feature-list { display: flex; flex-direction: column; gap: 8px; }
  .feature-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; display: flex; align-items: flex-start; gap: 12px; }
  .feature-card:hover { border-color: var(--border-secondary); }
  .feature-body { flex: 1; min-width: 0; }
  .feature-title { font-size: 14px; color: var(--text); font-weight: 500; margin-bottom: 3px; word-break: break-word; }
  .feature-note { font-size: 13px; color: var(--text-secondary); word-break: break-word; margin-top: 3px; }
  .feature-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 500; }
  .badge-todo { background: #D3D1C7; color: #444441; }
  .badge-inprogress { background: #B5D4F4; color: #0C447C; }
  .badge-done { background: #C0DD97; color: #27500A; }
  .badge-blocked { background: #F7C1C1; color: #791F1F; }
  .date-label { font-size: 11px; color: var(--text-tertiary); }
  .status-select { font-size: 12px; padding: 3px 7px; border-radius: var(--radius-md); border: 0.5px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { font-size: 13px; padding: 4px 8px; border-radius: var(--radius-md); border: 0.5px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; }
  .icon-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-tertiary); font-size: 14px; }
  .note-input { font-size: 13px; padding: 5px 10px; border-radius: var(--radius-md); border: 0.5px solid var(--border-secondary); background: var(--bg); color: var(--text); width: 100%; margin-top: 6px; outline: none; }
</style>
</head>
<body>
<h1>Typewriter — feature tracker</h1>
<div class="summary-row" id="summary-row"></div>
<div class="toolbar">
  <input type="text" id="new-title" placeholder="New feature or bug..." />
  <select id="new-status">
    <option value="todo">To Do</option>
    <option value="inprogress">In Progress</option>
    <option value="done">Done</option>
    <option value="blocked">Blocked</option>
  </select>
  <button class="btn" onclick="addFeature()">+ Add</button>
  <button class="btn" onclick="copyForClaude()">Copy for Claude</button>
</div>
<div class="filters" id="filters"></div>
<div class="feature-list" id="feature-list"></div>

<script>
const STORAGE_KEY = 'typewriter-features-v1';
const STATUSES = ['all','todo','inprogress','done','blocked'];
const STATUS_LABELS = { all:'All', todo:'To Do', inprogress:'In Progress', done:'Done', blocked:'Blocked' };
const BADGE_CLASS = { todo:'badge-todo', inprogress:'badge-inprogress', done:'badge-done', blocked:'badge-blocked' };

let features = [];
let activeFilter = 'all';
let editingNote = null;

function load() {
  try { features = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { features = []; }
  render();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(features)); } catch(e) {}
}

function addFeature() {
  const title = document.getElementById('new-title').value.trim();
  if (!title) return;
  const status = document.getElementById('new-status').value;
  features.unshift({ id: Date.now(), title, status, note: '', date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) });
  document.getElementById('new-title').value = '';
  save(); render();
}

document.getElementById('new-title').addEventListener('keydown', e => { if (e.key === 'Enter') addFeature(); });

function setStatus(id, status) {
  const f = features.find(x => x.id === id);
  if (f) { f.status = status; save(); render(); }
}

function deleteFeature(id) {
  if (!confirm('Delete this item?')) return;
  features = features.filter(x => x.id !== id);
  save(); render();
}

function saveNote(id, val) {
  const f = features.find(x => x.id === id);
  if (f) { f.note = val; save(); }
  editingNote = null; render();
}

function copyForClaude() {
  const lines = ['Typewriter feature tracker:\n'];
  STATUSES.slice(1).forEach(s => {
    const items = features.filter(f => f.status === s);
    if (items.length) {
      lines.push(STATUS_LABELS[s] + ':');
      items.forEach(f => { lines.push('- ' + f.title + (f.note ? ' (' + f.note + ')' : '')); });
      lines.push('');
    }
  });
  navigator.clipboard.writeText(lines.join('\n')).catch(() => {});
  const btn = document.querySelectorAll('.btn')[1];
  const orig = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

function render() {
  const filtered = activeFilter === 'all' ? features : features.filter(f => f.status === activeFilter);
  const counts = {};
  STATUSES.forEach(s => counts[s] = s === 'all' ? features.length : features.filter(f => f.status === s).length);

  document.getElementById('summary-row').innerHTML = STATUSES.slice(1).map(s =>
    '<div class="stat"><div class="stat-num">' + counts[s] + '</div><div class="stat-label">' + STATUS_LABELS[s] + '</div></div>'
  ).join('');

  document.getElementById('filters').innerHTML = STATUSES.map(s =>
    '<button class="filter-btn' + (activeFilter === s ? ' active' : '') + '" onclick="setFilter(\'' + s + '\')">' +
    STATUS_LABELS[s] + (s !== 'all' ? ' (' + counts[s] + ')' : '') + '</button>'
  ).join('');

  const list = document.getElementById('feature-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">' + (activeFilter === 'all' ? 'No features yet — add one above.' : 'No items with this status.') + '</div>';
    return;
  }

  list.innerHTML = filtered.map(f =>
    '<div class="feature-card">' +
      '<div class="feature-body">' +
        '<div class="feature-title">' + esc(f.title) + '</div>' +
        (f.note && editingNote !== f.id ? '<div class="feature-note">' + esc(f.note) + '</div>' : '') +
        (editingNote === f.id ? '<input class="note-input" id="note-' + f.id + '" value="' + escA(f.note) + '" placeholder="Add a note..." onblur="saveNote(' + f.id + ', this.value)" onkeydown="if(event.key===\'Enter\') saveNote(' + f.id + ', this.value)" />' : '') +
        '<div class="feature-meta">' +
          '<span class="badge ' + BADGE_CLASS[f.status] + '">' + STATUS_LABELS[f.status] + '</span>' +
          '<span class="date-label">' + f.date + '</span>' +
          '<select class="status-select" onchange="setStatus(' + f.id + ', this.value)">' +
            STATUSES.slice(1).map(s => '<option value="' + s + '"' + (f.status===s?' selected':'') + '>' + STATUS_LABELS[s] + '</option>').join('') +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="icon-btn" onclick="startNote(' + f.id + ')" title="Add note">✎</button>' +
        '<button class="icon-btn" onclick="deleteFeature(' + f.id + ')" title="Delete">✕</button>' +
      '</div>' +
    '</div>'
  ).join('');

  if (editingNote !== null) {
    const el = document.getElementById('note-' + editingNote);
    if (el) { el.focus(); el.select(); }
  }
}

function setFilter(s) { activeFilter = s; render(); }
function startNote(id) { editingNote = id; render(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return String(s).replace(/"/g,'&quot;'); }

load();
</script>
</body>
</html>
